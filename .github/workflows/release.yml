name: Release CI

on:
  push:
    tags:
      - 'v*'

env:
  # 'system' or 'module'
  TYPE: system
  RELEASE_TAG: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: Create & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 📝 Prepare Release Notes
        run: node tools/release-notes.js "$RELEASE_TAG" > release-notes.md

      - name: 🏷️ Create or Update GitHub Release
        id: release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md --verify-tag
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Configures NodeJS.
      - name: ⚙️ Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      # Installs & builds.
      - name: 🔧 Install Dependencies
        run: npm ci
      - name: 🧱 Build Project
        run: npm run build

      # Reads the package metadata used by the remaining steps.
      - name: 📄 Read Package Metadata
        id: metadata
        run: |
          echo "name=$(jq -r '.id' dist/${{ env.TYPE }}.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' dist/${{ env.TYPE }}.json)" >> "$GITHUB_OUTPUT"

      # Substitute the Manifest and Download URLs in the module.json
      - name: 📝 Substitute Manifest and Download Links For Versioned Ones
        run: |
          jq \
            --arg manifest "$MANIFEST_URL" \
            --arg download "$DOWNLOAD_URL" \
            '.manifest = $manifest | .download = $download' \
            "dist/${{ env.TYPE }}.json" > "dist/${{ env.TYPE }}.json.tmp"
          mv "dist/${{ env.TYPE }}.json.tmp" "dist/${{ env.TYPE }}.json"
        env:
          MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/${{ env.TYPE }}.json
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ steps.metadata.outputs.name }}-fvtt_v${{ steps.metadata.outputs.version }}.zip

      # Creates the ZIP artifact.
      - name: 📦 Create ZIP Archive
        run: |
          cd dist/
          zip -r ../${{ steps.metadata.outputs.name }}-fvtt_v${{ steps.metadata.outputs.version }}.zip .

      # Uploads artifacts to the release which triggered this workflow.
      - name: 🚀 Upload Release Artifacts
        run: |
          gh release upload "$RELEASE_TAG" \
            "./${{ steps.metadata.outputs.name }}-fvtt_v${{ steps.metadata.outputs.version }}.zip" \
            "./dist/${{ env.TYPE }}.json" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Compatibility
        run: echo "COMPATIBILITY=$(jq -c '.compatibility' dist/${{ env.TYPE }}.json)" >> "$GITHUB_ENV"

      - name: 🚩 Publish System to Foundry VTT Website
        if: ${{ vars.PUBLISH_TO_FOUNDRY == 'true' && steps.release.outputs.created == 'true' }}
        run: |
          REQUEST_BODY=$(jq -n \
            --arg id "$PACKAGE_ID" \
            --arg version "$PACKAGE_VERSION" \
            --arg manifest "$MANIFEST_URL" \
            --arg notes "$NOTES_URL" \
            --argjson dryRun "$DRY_RUN" \
            --argjson compatibility "$COMPATIBILITY" \
            '{
              id: $id,
              "dry-run": $dryRun,
              release: {
                version: $version,
                manifest: $manifest,
                notes: $notes,
                compatibility: $compatibility
              }
            }')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: $PACKAGE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$REQUEST_BODY" \
            'https://foundryvtt.com/_api/packages/release_version/'
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          PACKAGE_ID: ${{ steps.metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
          DRY_RUN: false
          MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.TYPE }}.json
          NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
