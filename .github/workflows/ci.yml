name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: 🔧 Install Dependencies
        run: npm ci

      - name: ✅ Lint & Build
        run: npm test
