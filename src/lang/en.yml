YZEGS.CombatActions.Hints.swim: Spend a Fast Action to move one water hex. A successful Mobility roll can add no more than one extra hex. A carried backpack gives −2.
YZEGS.CombatActions.Hints.stayAfloat: Roll Mobility when conditions require a test to remain afloat.
YZEGS.CombatActions.Hints.climbAboard: Roll Mobility to leave deep water and climb aboard the selected vessel.
YZEGS.CombatActions.Hints.rescueDrowning: Bring the target to the surface and roll Medical Aid as a Slow Action.
YZEGS.CombatActions.Hints.turnLargeVessel: Large vessels pay movement equal to Size minus one for each 60-degree turn. Use a Slow Action when speed is insufficient.
YZEGS.CombatActions.Hints.freeVessel: Spend a stretch and roll Driving with aid from another suitable vessel.
YZEGS.CombatActions.Hints.repairHull: Spend a shift, a suitable Spare Part, and a successful Tech roll to seal hull breaches.
YZEGS.CombatActions.Hints.bailWater: Spend a stretch and roll Stamina to reduce accumulated flooding.
YZEGS.CombatActions.Hints.ramVessel: Roll Driving; each success increases the damage caused to the other vessel.
YZEGS.CombatActions.Hints.evadeGuidedWeapon: An aware pilot or helmsman may spend a Slow Action and roll Driving at the configured modifier.
