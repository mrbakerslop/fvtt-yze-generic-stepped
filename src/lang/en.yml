YZEGS.CombatActions.Hints.spotShooter: Opposed Recon test. Spotting a shooter takes no action and ignores darkness; a silent or suppressed weapon does not grant the usual bonus.
YZEGS.CombatActions.Hints.spotSilentShooter: Opposed Recon test without the loud-shot bonus. Spotting takes no action and darkness is ignored.
YZEGS.CombatActions.Hints.blindFire: Fire into an adjacent indoor sector without exposing yourself. Only ammunition dice are rolled; ordinary shots can suppress but cannot inflict direct damage.
YZEGS.CombatActions.Hints.hugWall: Move tight against a wall. Indoor fire coming along that wall can deny the attacker's cover until the character's next turn.
YZEGS.CombatActions.Hints.enterBuilding: Entering through a door, window, or breach costs an additional Fast Action.
YZEGS.CombatActions.Hints.moveSector: Move to one adjacent close-quarters sector.
YZEGS.CombatActions.Hints.moveIndoorHex: Move one indoor hex. Indoor movement cannot be extended with a Mobility roll.
YZEGS.CombatActions.Hints.changeFloor: Move one floor by stairs or another normal route.
YZEGS.CombatActions.Hints.climbFloor: Climb one floor without stairs; roll Mobility.
YZEGS.CombatActions.Hints.breachWall: An extended breaching task completed outside combat. Place the resulting aperture with a Wall or Region on the Scene.
YZEGS.CombatActions.Hints.breachAperture: Spend one stretch and roll Stamina or Tech to breach a specific blocked door, window, wall, floor, or ceiling.
YZEGS.CombatActions.Hints.blockAperture: Spend one stretch blocking an aperture. Mark the blocked doorway or window with a Wall or Region.
YZEGS.CombatActions.Hints.blockIndoorHex: Spend one shift blocking an indoor hex and mark it on the Scene.
YZEGS.CombatActions.Hints.calmCrowd: Use Command to calm or control a crowd.
YZEGS.CombatActions.Hints.monitorRadio: Spend one shift monitoring radio traffic; the GM resolves any transmission.
YZEGS.CombatActions.Hints.overwatchAperture: Choose the ranged weapon covering a specific door, window, or breach and mark that aperture on the Scene.
YZEGS.CombatActions.Hints.vehicleCover: Hits on protected locations are redirected to the selected friendly Vehicle. Moving with it uses the character's normal actions but may occur outside their turn.
YZEGS.CombatActions.Hints.searchBoobyTrap: Roll Recon before passing the suspected location. A failed roll triggers an Urban Operations booby trap automatically.
YZEGS.CombatActions.Hints.placeBoobyTrap: Spend a stretch and roll Tech, then mark the trapped location with a hidden Region or tile.
YZEGS.CombatActions.Hints.placeUrbanObstacle: Spend one shift placing debris or sandbags and mark the affected hex on the Scene. Sandbag cover normally has Armor Level 4.
YZEGS.CombatActions.Hints.detectMines: Make a passive Recon test to notice mines before entering the affected area.
YZEGS.CombatActions.Hints.cautiousMineMovement: Move one hex and roll Recon. If no mine is found, the Minefield resolver checks for a trigger.
YZEGS.CombatActions.Hints.probeMines: Spend one stretch probing a single hex and roll Recon with a +2 modifier.
YZEGS.CombatActions.Hints.placeMines: Spend one stretch and roll Tech, then have the GM add a Minefield behavior to the affected Region.
YZEGS.CombatActions.Hints.clearMines: Spend one stretch clearing a hex and roll Tech. Failure can detonate a mine.
YZEGS.CombatActions.Hints.breakFreeDebris: Spend a Slow Action and roll Stamina to escape debris pinning the character.
YZEGS.Minefield.Actions.ClearFailed: The mine-clearing attempt failed and can detonate a mine. Resolve the Minefield hazard.
YZEGS.CombatActions.Hints.help: Helping spends the same type of action as the action being helped. This Fast entry is a tracker; adjust it to Slow when required.
